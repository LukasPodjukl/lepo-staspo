<!DOCTYPE html>
<html lang="en">

<style>
    table,
    th,
    td {
        border-collapse: collapse;
        padding-right: 30px;
    }

    tr:hover {
        background-color: yellow;
    }
</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mincovka</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>

<body>
    <h1>Mincovka</h1>
    <label for="months">Měsíc:</label>
    <select name="months" id="months">
        <option value="N" selected>-</option>
        <option value="J">Leden</option>
        <option value="O">Únor</option>
        <option value="T">Březen</option>
        <option value="Y">Duben</option>
        <option value="AE">Květen</option>
        <option value="AJ">Červen</option>
        <option value="AP">Červenec</option>
        <option value="AU">Srpen</option>
        <option value="AZ">Září</option>
        <option value="BE">Říjen</option>
        <option value="BJ">Listopad</option>
        <option value="BO">Prosinec</option>
    </select>
    <input type="file" id="upload" />
    <pre id="output"></pre>
    <script>
        var month;
        document.addEventListener("DOMContentLoaded", function(event) {
            month = document.getElementById("months").options[document.getElementById("months").selectedIndex].value;
        });
        document.getElementById("months").addEventListener("change", async function (event) {
            month = this.value;
        });
        document.getElementById("upload").addEventListener("change", async function (event) {
            console.log(month);
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function (e) {
                    const arrayBuffer = e.target.result;
                    const workbook = new ExcelJS.Workbook();
                    await workbook.xlsx.load(arrayBuffer);

                    const worksheet = workbook.getWorksheet(1);
                    let output = "";

                    var table = document.createElement("table");
                    var thead = table.appendChild(document.createElement("thead"));
                    var tbody = table.appendChild(document.createElement("tbody"));
                    var tfoot = table.appendChild(document.createElement("tfoot"));

                    const cols = new Map();
                    cols.set("ID", 0);
                    cols.set("X", 0);
                    cols.set("1000", 0);
                    cols.set("500", 0);
                    cols.set("200", 0);
                    cols.set("100", 0);
                    cols.set("50", 0);
                    cols.set("20", 0);
                    cols.set("10", 0);
                    cols.set("5", 0);
                    cols.set("2", 0);
                    cols.set("1", 0);

                    if (thead) {
                        var tr = document.createElement("tr");
                        for (const [key, value] of cols.entries()) {
                            var th = document.createElement("th");
                            th.style.border = "1px solid black";
                            th.textContent = key;
                            tr.appendChild(th);
                        }
                        thead.appendChild(tr);
                    }

                    if (tbody) {
                        worksheet.eachRow({ includeEmpty: true }, function (row, rowNumber) {
                            if (row.getCell(month).result != null && row.getCell(month).result != 0) {
                                if (row.getCell("A").value != null) {
                                    var tr = document.createElement("tr");
                                    var x = Math.round(row.getCell(month).result)
                                    var temp = x;
                                    for (const [key, value] of cols.entries()) {
                                        var td = document.createElement("td");
                                        td.style.border = "1px solid black";
                                        if (key === "ID") {
                                            td.textContent = `${row.getCell("B").value} [${row.getCell("A").value}]`;

                                            cols.set(key, parseInt(cols.get(key)) + 1);
                                        } else if (key === "X") {
                                            td.textContent = x;

                                            cols.set(key, parseInt(cols.get(key)) + x);
                                        } else {
                                            var tempMod = temp % parseInt(key);
                                            var count = (temp - tempMod) / parseInt(key);
                                            temp = tempMod;

                                            td.textContent = count;

                                            cols.set(key, parseInt(cols.get(key)) + count);
                                        }
                                        tr.appendChild(td);
                                    }
                                    tbody.appendChild(tr);
                                }
                            }
                        });
                    }

                    if (tfoot) {
                        var tr = document.createElement("tr");
                        for (const [key, value] of cols.entries()) {
                            var td = document.createElement("td");
                            td.textContent = value;
                            if (key === "ID") {
                                td.style.visibility = "hidden";
                            } else {
                                td.style.border = "2px solid black";
                            }
                            tr.appendChild(td);
                        }
                        tfoot.appendChild(tr);
                    }

                    document.getElementById("output").appendChild(table);
                };
                reader.readAsArrayBuffer(file);
            }
        });
    </script>
</body>

</html>
